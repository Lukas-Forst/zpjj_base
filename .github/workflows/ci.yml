name: ci
on: [push, pull_request]
jobs:
  worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/worker/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/worker/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: apps/worker
      - run: npm run gen:api
      - name: Generierte API-Typen sind aktuell
        run: git diff --exit-code -- lib/api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:design
      - run: npm test
      - run: npm run build
