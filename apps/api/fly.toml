app = "zpjj-base-api"
primary_region = "fra"

[build]

[mounts]
  source = "base_data"
  destination = "/data"
  snapshot_retention = 14   # daily snapshots

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1  # SQLite: exactly one machine, never scale out

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
